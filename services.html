<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP service</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f4f6f8;
  color: #222;
}

header {
  background: white;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.logo {
  font-size: 30px;
  font-weight: bold;
}

.logo span {
  color: #5146e5;
}

.menu {
  font-size: 30px;
}

.container {
  max-width: 700px;
  margin: 25px auto;
  padding: 10px;
}

.card {
  background: white;
  margin: 18px 0;
  padding: 22px;
  border-radius: 25px;
  box-shadow: 0 5px 15px rgba(0,0,0,.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.icon {
  width: 70px;
  height: 70px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 35px;
  background: #eee;
}

.info {
  flex: 1;
  margin-left: 18px;
}

.info h2 {
  margin: 0;
  font-size: 22px;
}

.info p {
  margin: 6px 0 0;
  color: #777;
}

button {
  border: 0;
  background: #5146e5;
  color: white;
  font-size: 18px;
  font-weight: bold;
  padding: 15px 25px;
  border-radius: 18px;
  cursor: pointer;
}

button:active {
  transform: scale(.96);
}

@media(max-width:600px) {
  .card {
    padding: 16px;
  }

  .icon {
    width: 60px;
    height: 60px;
  }

  .info h2 {
    font-size: 18px;
  }

  button {
    padding: 13px 18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">V<span>ipSmm</span></div>
  <div class="menu">☰</div>
</header>

<div class="container">

  <div class="card">
    <div class="icon">📱</div>
    <div class="info">
      <h2>Airtel</h2>
      <p>Recharge Unlimited 5G & 4G</p>
    </div>
    <button onclick="alert('Airtel plans coming soon')">Plans</button>
  </div>

  <div class="card">
    <div class="icon">📷</div>
    <div class="info">
      <h2>Instagram</h2>
      <p>Followers & Likes</p>
    </div>
    <button onclick="alert('Instagram plans coming soon')">Plans</button>
  </div>

  <div class="card">
    <div class="icon">▶️</div>
    <div class="info">
      <h2>YouTube</h2>
      <p>Watch-time & Subscribers</p>
    </div>
    <button onclick="alert('YouTube plans coming soon')">Plans</button>
  </div>

  <div class="card">
    <div class="icon">🛒</div>
    <div class="info">
      <h2>Amazon Prime</h2>
      <p>Monthly Membership</p>
    </div>
    <button onclick="alert('Amazon Prime plans coming soon')">Plans</button>
  </div>

  <div class="card">
    <div class="icon">🎮</div>
    <div class="info">
      <h2>Free Fire Top-Up</h2>
      <p>Diamonds & Event Packs</p>
    </div>
    <button onclick="alert('Free Fire plans coming soon')">Plans</button>
  </div>

  <div class="card">
    <div class="icon">▶</div>
    <div class="info">
      <h2>Play Store</h2>
      <p>Redeem Codes & Credits</p>
    </div>
    <button onclick="alert('Play Store plans coming soon')">Plans</button>
  </div>

</div>

</body>
    </html>
